PACKAGE_NAME="mt7925-awdl"
PACKAGE_VERSION="@PKGVER@"
# The mt76 source for the kernel being built is fetched and patched, so the
# module always matches that kernel's in-tree mt76 core.
PRE_BUILD="prepare.sh ${kernelver}"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/ksrc/drivers/net/wireless/mediatek/mt76/mt7925 CONFIG_MT7925_COMMON=m CONFIG_MT7925E=m modules"
CLEAN="rm -rf ksrc"
BUILT_MODULE_NAME[0]="mt7925-common"
BUILT_MODULE_LOCATION[0]="ksrc/drivers/net/wireless/mediatek/mt76/mt7925"
DEST_MODULE_LOCATION[0]="/updates/dkms"
BUILT_MODULE_NAME[1]="mt7925e"
BUILT_MODULE_LOCATION[1]="ksrc/drivers/net/wireless/mediatek/mt76/mt7925"
DEST_MODULE_LOCATION[1]="/updates/dkms"
AUTOINSTALL="yes"
